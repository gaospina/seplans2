spring.application.name=seplans2

# Do not leak stack traces or exception messages in error pages.
server.error.include-message=never
server.error.include-stacktrace=never

# The rule engine: one SWI-Prolog process per computation.
# Command that starts SWI-Prolog.
seplans.swipl.command=swipl
# Time allowed for one computation, including the wait for a free slot.
seplans.swipl.timeout=10s
# Number of SWI-Prolog processes allowed to run at the same time.
seplans.swipl.max-concurrent=4
# Memory limit of the Prolog stacks of one process.
seplans.swipl.stack-limit=256m
